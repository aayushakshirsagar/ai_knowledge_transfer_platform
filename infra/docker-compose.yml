version: "3.9"

services:
  backend:
    build:
      context: ../backend
    container_name: company-brain-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis
      - qdrant

    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000

  postgres:
    image: postgres:16
    container_name: company-brain-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: company_brain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: company-brain-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: company-brain-qdrant

    restart: unless-stopped

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: