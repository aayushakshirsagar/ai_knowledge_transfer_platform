

services:
  backend:
    build:
      context: ../backend
    container_name: company-brain-backend

    ports:
      - "8000:8000"

    env_file:
      - .env
    
    volumes:
    - ../backend:/app

    depends_on:
      - postgres
      - redis

    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16
    container_name: company-brain-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: company_brain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: company-brain-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

volumes:
  postgres_data: